name: Build CutList image

on:
  push:
    branches: [master]
    paths:
      - "CutList.Web/**"
      - "CutList.Core/**"
      - "CutList.Web/Dockerfile"
      - ".gitea/workflows/build-cutlist.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Gitea container registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login git.thecozycat.net -u "${{ gitea.actor }}" --password-stdin

      - name: Build image
        run: docker build -f CutList.Web/Dockerfile -t git.thecozycat.net/internal/cutlist:latest -t git.thecozycat.net/internal/cutlist:${{ gitea.sha }} .

      - name: Push image
        run: |
          docker push git.thecozycat.net/internal/cutlist:latest
          docker push git.thecozycat.net/internal/cutlist:${{ gitea.sha }}
